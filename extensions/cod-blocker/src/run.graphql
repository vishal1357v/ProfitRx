query RunInput {
  cart {
    cost {
      totalAmount {
        amount
        currencyCode
      }
    }
    deliveryGroups {
      deliveryAddress {
        zip
      }
    }
  }
  paymentMethods {
    id
    name
  }
  paymentCustomization {
    metafield(namespace: "$app:cod-blocker", key: "function-configuration") {
      value
    }
  }
}
